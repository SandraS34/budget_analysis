{% extends "base.html" %}

{% block title %} Edytuj wydatek {% endblock %}

{% block content %}
<a href="{{ url_for('manage_expenses', month=expense.month.strftime('%Y-%m')) }}"
   class="btn btn-outline-secondary mb-3">
    Powrót do zarządzania wydatkami
</a>

<section>
    <h2>Edytuj wydatek</h2>

    <form method="POST">
        <div class="mb-3">
            <label for="month" class="form-label">Miesiąc:</label>
            <input
                type="month"
                id="month"
                name="month"
                class="form-control"
                value="{{ expense.month.strftime('%Y-%m') }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="name" class="form-label">Cel wydatku:</label>
            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                value="{{ expense.name }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Kategoria:</label>
            <select id="category" name="category" class="form-select" required>
                {% for category in [
                    'Kredyty i inne zobowiązania',
                    'Opłaty mieszkaniowe',
                    'Wydatki na dzieci',
                    'Media i rachunki',
                    'Pozostałe wydatki'
                ] %}
                <option
                    value="{{ category }}"
                    {% if expense.category == category %}selected{% endif %}
                >
                    {{ category }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="amount" class="form-label">Kwota (zł):</label>
            <input
                type="number"
                id="amount"
                name="amount"
                class="form-control"
                min="0.01"
                step="0.01"
                value="{{ '%.2f'|format(expense.amount_grosze / 100) }}"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Zapisz zmiany
        </button>
    </form>
</section>
{% endblock %}
