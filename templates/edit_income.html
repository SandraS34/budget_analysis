{% extends "base.html" %}
{% block title %} Edytuj dochód {% endblock %}

{% block content %}
<a href="/" class="btn btn-outline-secondary mb-3">
    Powrót do strony głównej
</a>

<section>
    <h2>Edytuj dochód</h2>

    <form method="POST">
        <label for="month">Miesiąc:</label>
        <input
            type="month"
            id="month"
            name="month"
            value="{{ income.month.strftime('%Y-%m') }}"
            required
        >

        <label for="name">Źródło dochodu:</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ income.name }}"
            required
        >

        <label for="amount">Kwota (zł):</label>
        <input
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            step="0.01"
            value="{{ '%.2f'|format(income.amount_grosze / 100) }}"
            required
        >

        <button type="submit">Zapisz zmiany</button>
    </form>
</section>
{% endblock %}
